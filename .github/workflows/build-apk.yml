name: Build Study APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Validate content
        run: npm run validate
      - name: Sync Android assets
        run: npm run sync:android
      - name: Restore stable APK signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No stable signing key configured. Building for CI only; publish the locally signed APK manually." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle -p android-app assembleDebug
      - name: Name APK
        run: node scripts/name-apk.mjs
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-APK-CI
          path: android-app/app/build/outputs/apk/debug/Study.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: Study ${{ github.ref_name }}
          files: android-app/app/build/outputs/apk/debug/Study.apk
          generate_release_notes: true
